<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./paperx-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <title>PaperX</title>
</head>

<body>
  <div id="root">
    <div class="mx-auto flex min-h-screen max-w-6xl flex-col gap-4 px-4 py-6 sm:px-6 lg:px-8">
      <div class="animate-pulse rounded-[24px] border border-slate-300/60 bg-white/85 px-5 py-4 shadow-[0_24px_54px_-42px_rgba(8,23,38,0.34)] dark:border-slate-700/60 dark:bg-slate-950/70">
        <div class="h-9 w-40 rounded-full bg-slate-200/80 dark:bg-slate-800"></div>
        <div class="mt-3 h-3.5 w-60 rounded-full bg-slate-200/70 dark:bg-slate-800/80"></div>
      </div>
      <div id="community-bootstrap-list" class="grid gap-4"></div>
    </div>
  </div>
  <script>
    (() => {
      const hostedApiBase = "https://api.latextrans.online"
      const hostname = window.location.hostname
      const isLocal = hostname === "127.0.0.1" || hostname === "localhost"
      const runtimeConfiguredBase = document.documentElement.dataset.apiBase || ""
      const apiBase = runtimeConfiguredBase
        ? runtimeConfiguredBase.replace(/\/+$/, "")
        : isLocal
          ? hostedApiBase
          : ""
      const listNode = document.getElementById("community-bootstrap-list")

      function renderCards(payload) {
        if (!listNode || !payload || !Array.isArray(payload.items) || payload.items.length === 0) {
          return
        }

        listNode.innerHTML = ""

        payload.items.forEach((paper) => {
          const card = document.createElement("a")
          card.href = `/paper/${paper.id}`
          card.className =
            "block rounded-[20px] border border-slate-300/55 bg-white/90 px-5 py-4 text-slate-900 shadow-[0_18px_42px_-34px_rgba(8,23,38,0.34)] transition hover:-translate-y-0.5 hover:border-sky-400/40 dark:border-slate-700/60 dark:bg-slate-950/75 dark:text-slate-100"

          const status = document.createElement("div")
          status.className = "text-[11px] uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400"
          status.textContent = `${paper.community_status || "community"} · ${paper.trans_status || "unknown"}`

          const title = document.createElement("h2")
          title.className = "mt-3 text-lg font-semibold"
          title.textContent = paper.title || paper.arxiv_id || "Paper"

          const meta = document.createElement("p")
          meta.className = "mt-2 text-sm text-slate-600 dark:text-slate-300"
          meta.textContent = Array.isArray(paper.categories) && paper.categories.length
            ? paper.categories.join(" · ")
            : paper.arxiv_id || ""

          card.appendChild(status)
          card.appendChild(title)
          card.appendChild(meta)
          listNode.appendChild(card)
        })
      }

      if (!apiBase || !listNode) {
        return
      }

      window.__COMMUNITY_BOOTSTRAP_PROMISE__ = fetch(`${apiBase}/api/papers?sort=latest&limit=3`, {
        credentials: "omit",
      })
        .then((response) => (response.ok ? response.json() : null))
        .then((payload) => {
          if (payload && Array.isArray(payload.items)) {
            window.__COMMUNITY_BOOTSTRAP__ = { feed: payload }
            renderCards(payload)
            return payload
          }
          return null
        })
        .catch(() => null)
    })()
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
